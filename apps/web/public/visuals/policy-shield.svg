<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" width="100%" height="100%" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <radialGradient id="shieldGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="380" height="460" fill="transparent" />
  <circle cx="190" cy="210" r="170" fill="url(#shieldGlow)" />

  <!-- Outer Shield Outline -->
  <path d="M 190,26 L 345,90 C 345,280 190,395 190,436 C 190,395 35,280 35,90 Z" 
        fill="#0b0e17" stroke="#67e8f9" stroke-width="2.5" />

  <!-- Inner Shield Detail -->
  <path d="M 190,56 L 312,110 C 312,260 190,356 190,395 C 190,356 68,260 68,110 Z" 
        fill="#0f1322" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="4 4" />

  <!-- Security Verification Emblem (Golden ring + Cyan checkmark) -->
  <circle cx="190" cy="170" r="40" fill="#141a2e" stroke="#fbbf24" stroke-width="2.2" />
  <path d="M 174,170 L 186,182 L 208,158" fill="none" stroke="#67e8f9" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Policy Bounded Badge Pill -->
  <g transform="translate(190, 252)">
    <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#121829" stroke="#67e8f9" stroke-width="1.2" />
    <text x="0" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">POLICY BOUNDED</text>
  </g>

  <!-- Deterministic Checks Sub-Badge Pill -->
  <g transform="translate(190, 300)">
    <rect x="-105" y="-15" width="210" height="30" rx="15" fill="#071916" stroke="#67e8f9" stroke-width="1" stroke-dasharray="3 3" />
    <text x="0" y="4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#67e8f9" text-anchor="middle" letter-spacing="1.2">DETERMINISTIC CHECKS</text>
  </g>

  <!-- Guard Status Pill -->
  <g transform="translate(190, 344)">
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#18150a" stroke="#fbbf24" stroke-width="1" />
    <text x="0" y="4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#fbbf24" text-anchor="middle" letter-spacing="1">ZERO LLM BIAS</text>
  </g>
</svg>
