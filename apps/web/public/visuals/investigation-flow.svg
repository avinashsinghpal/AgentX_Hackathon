<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#eca8d6" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="transparent" />
  
  <!-- Step Nodes -->
  <g stroke="#33334d" stroke-width="1.5">
    <!-- Node 1 -->
    <rect x="80" y="80" width="180" height="60" rx="8" fill="#0d111a" stroke="#67e8f9" />
    <text x="170" y="115" font-family="monospace" font-size="11" fill="#67e8f9" text-anchor="middle">1. Request Ingest</text>
    
    <!-- Node 2 -->
    <rect x="310" y="160" width="180" height="60" rx="8" fill="#0d111a" stroke="#a78bfa" />
    <text x="400" y="195" font-family="monospace" font-size="11" fill="#a78bfa" text-anchor="middle">2. Verify &amp; Scope</text>

    <!-- Node 3 -->
    <rect x="540" y="240" width="180" height="60" rx="8" fill="#0d111a" stroke="#67e8f9" />
    <text x="630" y="275" font-family="monospace" font-size="11" fill="#67e8f9" text-anchor="middle">3. Tool Investigation</text>

    <!-- Node 4 -->
    <rect x="420" y="340" width="180" height="60" rx="8" fill="#0d111a" stroke="#fbbf24" />
    <text x="510" y="375" font-family="monospace" font-size="11" fill="#fbbf24" text-anchor="middle">4. Deterministic Eval</text>

    <!-- Node 5 -->
    <rect x="180" y="440" width="180" height="60" rx="8" fill="#0d111a" stroke="#67e8f9" />
    <text x="270" y="475" font-family="monospace" font-size="11" fill="#67e8f9" text-anchor="middle">5. Act &amp; Verify</text>
  </g>

  <!-- Connectors -->
  <path d="M 260,110 L 310,190" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M 490,190 L 540,270" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M 630,300 L 510,340" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M 420,370 L 360,450" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="4 4" />
</svg>

