<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <linearGradient id="p1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="p2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="p3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#eca8d6" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="420" fill="transparent" />

  <!-- Paths branching from Case node -->
  <!-- Path 1: Execute -->
  <path d="M 148,210 C 360,210 480,75 620,75" fill="none" stroke="url(#p1)" stroke-width="2.5" />
  
  <!-- Path 2: Needs Approval -->
  <path d="M 148,210 C 360,210 480,210 620,210" fill="none" stroke="url(#p2)" stroke-width="2.5" />

  <!-- Path 3: Explain / Deny -->
  <path d="M 148,210 C 360,210 480,345 620,345" fill="none" stroke="url(#p3)" stroke-width="2.5" />

  <!-- Origin: Case node -->
  <circle cx="110" cy="210" r="38" fill="#0d0f17" stroke="#a78bfa" stroke-width="2" />
  <circle cx="110" cy="210" r="44" fill="none" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3" />
  <text x="110" y="215" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">CASE</text>

  <!-- Destination 1: EXECUTE -->
  <g transform="translate(620, 35)">
    <rect width="300" height="80" rx="8" fill="#071916" stroke="#67e8f9" stroke-width="1.5" />
    <circle cx="28" cy="40" r="5" fill="#67e8f9" filter="url(#glow1)" />
    <text x="50" y="37" font-family="monospace" font-size="14" font-weight="bold" fill="#67e8f9" letter-spacing="1">EXECUTE</text>
    <text x="50" y="58" font-family="sans-serif" font-size="12" fill="#94a3b8">Autonomous Instant Resolution</text>
  </g>

  <!-- Destination 2: NEEDS APPROVAL -->
  <g transform="translate(620, 170)">
    <rect width="300" height="80" rx="8" fill="#18150a" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="28" cy="40" r="5" fill="#fbbf24" filter="url(#glow1)" />
    <text x="50" y="37" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24" letter-spacing="1">NEEDS APPROVAL</text>
    <text x="50" y="58" font-family="sans-serif" font-size="12" fill="#94a3b8">Queued for Merchant Review</text>
  </g>

  <!-- Destination 3: EXPLAIN -->
  <g transform="translate(620, 305)">
    <rect width="300" height="80" rx="8" fill="#1b0d18" stroke="#eca8d6" stroke-width="1.5" />
    <circle cx="28" cy="40" r="5" fill="#eca8d6" filter="url(#glow1)" />
    <text x="50" y="37" font-family="monospace" font-size="14" font-weight="bold" fill="#eca8d6" letter-spacing="1">EXPLAIN</text>
    <text x="50" y="58" font-family="sans-serif" font-size="12" fill="#94a3b8">Policy Guidance &amp; Clear Rationale</text>
  </g>
</svg>
