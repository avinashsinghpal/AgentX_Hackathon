<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <radialGradient id="connGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="360" fill="transparent" />
  <circle cx="500" cy="180" r="140" fill="url(#connGlow)" />

  <!-- Connector Lines -->
  <!-- Left: Orders -->
  <line x1="230" y1="180" x2="434" y2="180" stroke="#67e8f9" stroke-width="2" stroke-dasharray="4 4" opacity="0.85" />
  
  <!-- Right: Logistics -->
  <line x1="566" y1="180" x2="770" y2="180" stroke="#eca8d6" stroke-width="2" stroke-dasharray="4 4" opacity="0.85" />

  <!-- Top-Center: Storefront -->
  <line x1="500" y1="114" x2="500" y2="74" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.85" />

  <!-- Central Hub: Store Connector -->
  <circle cx="500" cy="180" r="64" fill="#0c0e17" stroke="#a78bfa" stroke-width="2.5" />
  <circle cx="500" cy="180" r="72" fill="none" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3" />
  <text x="500" y="174" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">STORE</text>
  <text x="500" y="194" font-family="monospace" font-size="11" font-weight="bold" fill="#67e8f9" text-anchor="middle" letter-spacing="1">CONNECTOR</text>

  <!-- Left Node: Orders & E-commerce -->
  <g transform="translate(180, 180)">
    <circle cx="0" cy="0" r="48" fill="#071916" stroke="#67e8f9" stroke-width="1.8" />
    <text x="0" y="-4" font-family="monospace" font-size="11" font-weight="bold" fill="#67e8f9" text-anchor="middle" letter-spacing="1">ORDERS</text>
    <text x="0" y="14" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Shopify / Woo</text>
  </g>

  <!-- Right Node: Logistics & Couriers -->
  <g transform="translate(820, 180)">
    <circle cx="0" cy="0" r="48" fill="#1b0d18" stroke="#eca8d6" stroke-width="1.8" />
    <text x="0" y="-4" font-family="monospace" font-size="11" font-weight="bold" fill="#eca8d6" text-anchor="middle" letter-spacing="1">LOGISTICS</text>
    <text x="0" y="14" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Couriers / AWB</text>
  </g>

  <!-- Top Node: Payments & Escrow -->
  <g transform="translate(500, 52)">
    <rect x="-90" y="-20" width="180" height="40" rx="20" fill="#18150a" stroke="#fbbf24" stroke-width="1.5" />
    <text x="0" y="5" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="1">PAYMENTS &amp; COD</text>
  </g>
</svg>
